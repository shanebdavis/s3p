services:
  s3:
    image: minio/minio
    volumes:
      - minio-data:/data
    entrypoint: sh
    command: -c 'mkdir -p /data/s3p-test && /usr/bin/minio server --console-address=0.0.0.0:9002 /data'
    ports:
      - '9000:9000'
      - '9002:9002'
    environment:
      MINIO_ROOT_USER: testAccessKey
      MINIO_ROOT_PASSWORD: testSecretKey

  # second, independent "environment" with different credentials -
  # used by the cross-environment tests (S3_ENDPOINT_B=http://localhost:9010)
  s3b:
    image: minio/minio
    volumes:
      - minio-data-b:/data
    entrypoint: sh
    command: -c 'mkdir -p /data/s3p-test && /usr/bin/minio server --console-address=0.0.0.0:9012 /data'
    ports:
      - '9010:9000'
      - '9012:9012'
    environment:
      MINIO_ROOT_USER: testAccessKeyB
      MINIO_ROOT_PASSWORD: testSecretKeyB

volumes:
  minio-data:
  minio-data-b:
